name: auto-update-videos

# Tự động mỗi ngày 07:30 giờ Việt Nam (00:30 UTC): crawl video mới -> build -> deploy Netlify
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Update videos (crawl new + comments + servers)
        run: node scripts/auto_update.mjs

      # Commit data mới về repo để lần chạy sau chỉ crawl phần còn thiếu
      - name: Commit data if changed
        run: |
          git config user.name "auto-update-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "chore: auto-update videos $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build
        run: NODE_OPTIONS=--max-old-space-size=6144 npm run build

      # Deploy lên Netlify (chạy khi đã có token trong repo secrets)
      - name: Load token
        run: echo "TOK=${{ secrets.NETLIFY_AUTH_TOKEN }}" >> "$GITHUB_ENV"

      - name: Deploy to Netlify
        if: ${{ env.TOK != '' }}
        run: npx netlify-cli@latest deploy --build-dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
